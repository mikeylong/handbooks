name: Handbook collection
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate-collection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: pip install pypdf==6.10.0
      - run: npm run validate
      - name: Verify final term index
        run: python3 publish-evidence-backed-handbook/scripts/validate-term-index.py --book ai-native-organization --html site/output/site/ai-native-organization/index.html --pdf ai-native-organization/output/pdf/ai-native-organization-v1.1.0-2026-10-23-daytime-r1.pdf --pdf ai-native-organization/output/pdf/ai-native-organization-v1.1.0-2026-10-23-late-night-r1.pdf
      - name: Verify AI-Native published heading labels
        run: python3 publish-evidence-backed-handbook/scripts/validate-heading-labels.py --book ai-native-organization --html site/output/site/ai-native-organization/index.html --markdown site/output/site/ai-native-organization/editions/v1.1.0/ai-native-organization-v1.1.0.md --pdf ai-native-organization/output/pdf/ai-native-organization-v1.1.0-2026-10-23-daytime-r1.pdf --pdf ai-native-organization/output/pdf/ai-native-organization-v1.1.0-2026-10-23-late-night-r1.pdf

  validate-velori:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: claude-design/samples/velori-store
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: python scripts/package-candidate.py --audience public --output "$RUNNER_TEMP/velori-store.zip"
      - run: python scripts/validate-package.py "$RUNNER_TEMP/velori-store.zip"

  pdf-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: pip install -r publish-evidence-backed-handbook/requirements.txt
      - run: pip install pdfplumber==0.11.9
      - name: Test shared first-edition rendering rules
        run: |
          python publish-evidence-backed-handbook/scripts/test-heading-wrap.py
          python publish-evidence-backed-handbook/scripts/test-term-index.py
          node publish-evidence-backed-handbook/scripts/test-term-index-markdown.mjs
          python publish-evidence-backed-handbook/scripts/test-quantitative-charts.py
          python publish-evidence-backed-handbook/scripts/test-reader-heading-labels.py
          python publish-evidence-backed-handbook/scripts/test-eyebrow-roles.py
          python publish-evidence-backed-handbook/scripts/test-concept-diagrams.py
          python publish-evidence-backed-handbook/scripts/test-grouped-diagrams.py
          python publish-evidence-backed-handbook/scripts/test-measured-page-map.py
          node publish-evidence-backed-handbook/scripts/test-first-edition-reader.mjs
      - run: python production-ai-engineering/scripts/test-weekly-toolkit.py
      - run: python production-ai-engineering/scripts/test-pdf-structure.py
      - run: npm install --prefix "$RUNNER_TEMP/pdf-browser" playwright@1.62.1
      - run: npx --prefix "$RUNNER_TEMP/pdf-browser" playwright install --with-deps chromium
      - name: Validate changed and unchanged Production AI PDFs end to end
        run: |
          browser=$(find "$HOME/.cache/ms-playwright" -path '*/chrome-linux64/chrome' -print -quit)
          python production-ai-engineering/scripts/test-weekly-pdf-integration.py --browser "$browser" --playwright-module "$RUNNER_TEMP/pdf-browser/node_modules/playwright" --output "$RUNNER_TEMP/production-ai-pdf-integration"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: production-ai-pdf-integration-evidence
          path: |
            ${{ runner.temp }}/production-ai-pdf-integration/integration-results.json
            ${{ runner.temp }}/production-ai-pdf-integration/*/*.log
            ${{ runner.temp }}/production-ai-pdf-integration/*/page-map*.json
      - uses: actions/upload-artifact@v6
        with:
          name: production-ai-pdf-fixtures
          path: |
            ${{ runner.temp }}/production-ai-pdf-integration/changed/daytime.pdf
            ${{ runner.temp }}/production-ai-pdf-integration/unchanged/daytime.pdf
      - name: Extract and validate portable package
        run: |
          python publish-evidence-backed-handbook/scripts/package-skill.py --output "$RUNNER_TEMP/toolkit.zip"
          unzip -q "$RUNNER_TEMP/toolkit.zip" -d "$RUNNER_TEMP/toolkit"
          python "$RUNNER_TEMP/toolkit/publish-evidence-backed-handbook/scripts/validate-package.py"
          python "$RUNNER_TEMP/toolkit/publish-evidence-backed-handbook/scripts/test-pdf-validation-checks.py"
          node "$RUNNER_TEMP/toolkit/publish-evidence-backed-handbook/scripts/test-pdf-downloads.mjs"
          python "$RUNNER_TEMP/toolkit/publish-evidence-backed-handbook/scripts/test-font-resources.py"
          python "$RUNNER_TEMP/toolkit/publish-evidence-backed-handbook/scripts/test-markdown-runtime.py" --output "$RUNNER_TEMP/markdown-regression"
          python "$RUNNER_TEMP/toolkit/publish-evidence-backed-handbook/scripts/test-code-blocks.py"
      - name: Generate both portable rendering paths
        run: |
          browser=$(find "$HOME/.cache/ms-playwright" -path '*/chrome-linux64/chrome' -print -quit)
          python "$RUNNER_TEMP/toolkit/publish-evidence-backed-handbook/scripts/build-pdf-fixtures.py" --output "$RUNNER_TEMP/pdf-fixtures" --browser "$browser" --playwright-module "$RUNNER_TEMP/pdf-browser/node_modules/playwright"
      - run: python publish-evidence-backed-handbook/scripts/test-pdf-runtime.py --fixtures "$RUNNER_TEMP/pdf-fixtures" --output "$RUNNER_TEMP/pdf-evidence"
      - run: node "$RUNNER_TEMP/toolkit/publish-evidence-backed-handbook/scripts/test-pdf-downloads.mjs" "$RUNNER_TEMP/pdf-fixtures/pdfs/next-edition"
      - run: python "$RUNNER_TEMP/toolkit/publish-evidence-backed-handbook/scripts/validate-package.py"
      - uses: actions/upload-artifact@v6
        with:
          name: pdf-fixtures
          path: ${{ runner.temp }}/pdf-fixtures/pdfs
      - uses: actions/upload-artifact@v6
        with:
          name: pdf-structural-evidence
          path: ${{ runner.temp }}/pdf-evidence

  pdfkit-evidence:
    needs: pdf-runtime
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: pdf-fixtures
          path: pdf-fixtures
      - uses: actions/download-artifact@v7
        with:
          name: production-ai-pdf-fixtures
          path: production-ai-pdf-fixtures
      - name: Render portable and Production AI fixture pages with Apple PDFKit
        run: |
          swiftc publish-evidence-backed-handbook/scripts/render-pdfkit.swift -o "$RUNNER_TEMP/render-pdfkit"
          while IFS= read -r pdf; do
            "$RUNNER_TEMP/render-pdfkit" --pdf "$pdf" --output-dir "pdfkit-proof/${pdf%.pdf}" --dpi 144
          done < <(find pdf-fixtures production-ai-pdf-fixtures -name '*.pdf' -type f)
      - uses: actions/upload-artifact@v6
        with:
          name: pdfkit-proof
          path: pdfkit-proof
