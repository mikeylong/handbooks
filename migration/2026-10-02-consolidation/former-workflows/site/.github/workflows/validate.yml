name: Independent handbook site
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm run validate:front-pages
