name: Production release contract

on:
  pull_request:
  merge_group:
    types:
      - checks_requested
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-production-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install PDF text tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Validate the production release contract
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha || github.sha }}
        run: node scripts/validate-production-release.mjs --base "$BASE_SHA" --head "$HEAD_SHA"
